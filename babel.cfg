# What `pybabel extract` reads. See docs/frontend/translations.md.
#
#   PYTHONPATH=. venv/bin/pybabel extract -F babel.cfg -c REVIEW -k mark -o translations/messages.pot --no-location --sort-output .
#   venv/bin/pybabel update -i translations/messages.pot -d translations
#   venv/bin/pybabel compile -d translations
#
# Wording kept in module-level constants is read by VALUE (i18n.extract_constants),
# because those modules keep plain English strings and translate where the
# text is used. `review = true` marks every string from that file as needing
# a fluent reader's sign-off before the language goes live.

[extractors]
constants = i18n:extract_constants

[constants: branding.py]
names = SHORT_DISCLAIMER, LAW_PAGE_NOTE, LAW_PAGE_NOTE_DETAIL, PRIVACY_NOTE_TITLE, PRIVACY_NOTE, PRIVACY_NOTE_DETAIL, LEARN_MORE_LABEL, PRIVACY_LABEL, PRIVACY_TITLE, PRIVACY_LEDE, PRIVACY_SECTIONS, PRIVACY_ACCOUNT_TITLE, PRIVACY_ACCOUNT_TEXT, TOP_DISCLAIMER, TOP_DISCLAIMER_DETAIL, PER_MESSAGE_DISCLAIMER, FULL_DISCLAIMER_POINTS, HELP_RESOURCES
keys = detail, lead, title, intro, points
review = true

[constants: password_safety.py]
names = RULE_MESSAGE, MESSAGE, RULES
review = true

[constants: form_review.py]
names = TRANSLATABLE
review = true

[constants: case_context.py]
names = LABELS, CHOICE_LABELS, SUMMARY_LABELS

[constants: account_requirements.py]
names = TRANSLATABLE

[constants: error_pages.py]
names = COPY, _FALLBACK

[python: routes.py]
[python: case_routes.py]
[python: usage_routes.py]
[python: i18n.py]
[python: profile_service.py]
[python: form_service.py]
[python: area_service.py]
[python: building_service.py]

[jinja2: templates/**.html]
